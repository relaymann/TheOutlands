name: Build and publish mod

concurrency:
  group: theoutlands-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install audio encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate local asset import tools
        run: python3 -m py_compile tools/import_alpha_assets.py tools/import_prepared_alpha_resources.py tools/import_classic_sounds.py

      - name: Generate original entity audio
        run: python3 tools/generate_entity_audio.py

      - name: Generate original Alpha-inspired textures
        run: python3 tools/generate_alpha_textures.py

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build and test mod
        run: gradle --no-daemon clean test build

      - name: Prepare release files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev*.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one distributable mod JAR, found ${#jars[@]}:"
            printf '%s\\n' "${jars[@]}"
            exit 1
          fi
          mkdir -p release
          cp "${jars[0]}" release/TheOutlands.jar
          cd release
          sha256sum TheOutlands.jar > TheOutlands.jar.sha256
          test -s TheOutlands.jar
          ls -lh TheOutlands.jar TheOutlands.jar.sha256

      - name: Publish rolling download release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest The Outlands build
          body: |
            Automatically updated from the latest successful build of the `main` branch.

            **Minecraft:** Java Edition 1.21.1
            **Mod loader:** NeoForge 21.1.266
            **Java:** 21

            This is an experimental development build. Back up worlds before testing.
            Download `TheOutlands.jar` and place it in your Minecraft instance's `mods` folder.
          files: |
            release/TheOutlands.jar
            release/TheOutlands.jar.sha256
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
