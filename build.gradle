plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
sourceSets.main.resources {
    srcDir('src/generated/resources')
    // Exclude only imported vanilla overrides; never exclude this mod's own assets.
    exclude('assets/minecraft/textures/**')
    exclude('assets/minecraft/sounds/**')
    exclude('**/*.bbmodel')
}
neoForge {
    version = project.neo_version
    parchment { mappingsVersion = project.parchment_mappings_version; minecraftVersion = project.parchment_minecraft_version }
    runs {
        client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach { systemProperty 'forge.logging.markers', 'REGISTRIES'; logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
repositories {
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    // Official GeckoLib Maven repository.
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
}

dependencies {
    // GeckoLib is a required runtime and compile dependency for the animated entity roster.
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"

    // Compile against the API without bundling it: Simple Voice Chat remains optional at runtime.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    localRuntime "maven.modrinth:simple-voice-chat:neoforge-${voicechat_mod_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }

def generateCreatureAnatomy = tasks.register('generateCreatureAnatomy', Exec) {
    group = 'theoutlands'
    description = 'Generate per-creature anatomy geometry and articulated animation overlays.'
    commandLine 'python3', 'tools/generate_creature_anatomy.py'
    inputs.files(fileTree('src/main/resources/assets/theoutlands/geo/entity') { include '*.geo.json' },
            file('src/main/resources/assets/theoutlands/animations/entity/outlands_monster.animation.json'),
            file('tools/generate_creature_anatomy.py'))
    outputs.dir('src/generated/resources/assets/theoutlands/geo/entity')
    outputs.file('src/generated/resources/assets/theoutlands/animations/entity/outlands_monster.animation.json')
}
tasks.named('processResources').configure { dependsOn(generateCreatureAnatomy) }
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, loader_version_range: loader_version_range, mod_id: mod_id,
            mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            voicechat_api_version: voicechat_api_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask generateModMetadata
publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
    repositories { maven { url = layout.projectDirectory.dir('repo').asFile.toURI() } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
idea { module { downloadSources = true; downloadJavadoc = true } }
